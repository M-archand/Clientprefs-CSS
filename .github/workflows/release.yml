name: Build and Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from ModuleVersion
        id: version
        run: |
          VERSION=$(grep -oP 'ModuleVersion\s*=>\s*\$?"\K[^"]+' src/Clientprefs.cs | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find ModuleVersion in src/Clientprefs.cs"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Build Clientprefs plugin
        run: |
          # Clientprefs.csproj has a ProjectReference to ClientprefsApi,
          # so this transitively restores+builds the shared API too.
          # Each csproj pins its own OutputPath (BuildOutput/...) — no -o needed.
          dotnet restore Clientprefs.csproj
          dotnet build Clientprefs.csproj -c Release --no-restore

      - name: Assemble release package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FOLDER="Clientprefs-v${VERSION}"
          PLUGIN_OUT="BuildOutput/plugins/Clientprefs"
          SHARED_OUT="BuildOutput/shared/ClientprefsApi"

          if [ ! -f "${PLUGIN_OUT}/Clientprefs.dll" ]; then
            echo "::error::Clientprefs.dll not found in ${PLUGIN_OUT} after build"
            exit 1
          fi
          if [ ! -f "${SHARED_OUT}/ClientprefsApi.dll" ]; then
            echo "::error::ClientprefsApi.dll not found in ${SHARED_OUT} after build"
            exit 1
          fi

          # CSS install layout: archive root holds Clientprefs-v{version}/
          #   addons/counterstrikesharp/plugins/Clientprefs/  -> plugin dll + runtime deps + lang
          #   addons/counterstrikesharp/shared/ClientprefsApi/ -> API dll
          rm -rf package
          ROOT="package/${FOLDER}"
          PLUGIN_DIR="${ROOT}/addons/counterstrikesharp/plugins/Clientprefs"
          SHARED_DIR="${ROOT}/addons/counterstrikesharp/shared/ClientprefsApi"
          mkdir -p "${PLUGIN_DIR}" "${SHARED_DIR}"

          # Plugin assemblies + runtime deps (pdb excluded; ClientprefsApi.dll
          # already pruned from plugin output by the csproj ExcludeStoreApiFiles target).
          # DB runtime deps (Dapper, MySqlConnector, Microsoft.Data.Sqlite, SQLitePCLRaw)
          # ship with the plugin; CounterStrikeSharp does not provide them.
          cp "${PLUGIN_OUT}"/*.dll "${PLUGIN_DIR}/"
          cp "${PLUGIN_OUT}/Clientprefs.deps.json" "${PLUGIN_DIR}/"

          # Native SQLite library (runtimes/<rid>/native/). The plugin loader resolves it
          # from Clientprefs.deps.json relative to the plugin folder, so the directory
          # layout must be preserved. The csproj keeps only linux-x64 and win-x64.
          cp -r "${PLUGIN_OUT}/runtimes" "${PLUGIN_DIR}/"

          # Shared API assembly
          cp "${SHARED_OUT}/ClientprefsApi.dll" "${SHARED_DIR}/"

          # Resources (lang is copied into the plugin output by the csproj)
          cp -r "${PLUGIN_OUT}/lang" "${PLUGIN_DIR}/"

          cd package
          zip -r "../${FOLDER}.zip" "${FOLDER}"
          cd ..
          echo "Created ${FOLDER}.zip"

      - name: Verify release package contents
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FOLDER="Clientprefs-v${VERSION}"
          ZIP="${FOLDER}.zip"
          PLUGIN_PATH="${FOLDER}/addons/counterstrikesharp/plugins/Clientprefs"
          SHARED_PATH="${FOLDER}/addons/counterstrikesharp/shared/ClientprefsApi"

          LISTING=$(unzip -Z1 "${ZIP}")
          FAILED=0

          # Every file the plugin needs at runtime on a clean CounterStrikeSharp install.
          # If a NuGet bump or csproj change drops one of these, the release must fail here
          # instead of on a user's server (CONCERNS C-01: SQLite driver stripped from the zip).
          REQUIRED=(
            "${PLUGIN_PATH}/Clientprefs.dll"
            "${PLUGIN_PATH}/Clientprefs.deps.json"
            "${PLUGIN_PATH}/Dapper.dll"
            "${PLUGIN_PATH}/MySqlConnector.dll"
            "${PLUGIN_PATH}/Microsoft.Data.Sqlite.dll"
            "${PLUGIN_PATH}/SQLitePCLRaw.batteries_v2.dll"
            "${PLUGIN_PATH}/SQLitePCLRaw.core.dll"
            "${PLUGIN_PATH}/SQLitePCLRaw.provider.e_sqlite3.dll"
            "${PLUGIN_PATH}/runtimes/linux-x64/native/libe_sqlite3.so"
            "${PLUGIN_PATH}/runtimes/win-x64/native/e_sqlite3.dll"
            "${PLUGIN_PATH}/lang/en.json"
            "${SHARED_PATH}/ClientprefsApi.dll"
          )
          for f in "${REQUIRED[@]}"; do
            if ! grep -qxF "$f" <<< "$LISTING"; then
              echo "::error::Missing from release package: $f"
              FAILED=1
            fi
          done

          # Host-provided assemblies must NOT ship; duplicates cause type-identity clashes.
          FORBIDDEN=$(grep -E "^${PLUGIN_PATH}/(Microsoft\.Extensions\.|Serilog|McMaster\.|Tomlyn|Scrutor|FastGenericNew|CounterStrikeSharp\.API|ClientprefsApi)" <<< "$LISTING" || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Host-provided assemblies leaked into the plugin folder:"
            echo "$FORBIDDEN"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "Full package listing:"
            echo "$LISTING"
            exit 1
          fi
          echo "Release package contents verified."

      - name: Prepare release artifact
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          ZIP_SRC=$(find . -name "Clientprefs-v${VERSION}.zip" -not -path "./release-artifacts/*" | head -1)
          if [ -z "$ZIP_SRC" ]; then
            echo "::error::Clientprefs-v${VERSION}.zip not found after build"
            exit 1
          fi
          echo "Found zip: $ZIP_SRC"

          mkdir -p release-artifacts
          NEW_NAME="Clientprefs-v${VERSION}.zip"
          mv "$ZIP_SRC" "release-artifacts/$NEW_NAME"
          echo "artifact=release-artifacts/$NEW_NAME" >> $GITHUB_OUTPUT
          echo "Prepared: $NEW_NAME"

      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          REPO_NAME="${{ github.event.repository.name }}"
          BASE_TAG="v${VERSION}"
          TAG="$BASE_TAG"
          TITLE="${BASE_TAG}"
          BUILD_NUM=1

          while gh release view "$TAG" &>/dev/null; do
            BUILD_NUM=$((BUILD_NUM + 1))
            TAG="${BASE_TAG}-${BUILD_NUM}"
            TITLE="${REPO_NAME} | ${BASE_TAG}#${BUILD_NUM}"
            echo "Tag exists, trying: $TAG"
          done

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Get previous tag for changelog link
        id: prev_tag
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "prev_tag=$PREV" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="${{ steps.tag.outputs.title }}"
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"

          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          NOTES="Release ${TAG}"
          if [ -n "$PREV_TAG" ]; then
            NOTES="${NOTES}"$'\n\n'"**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            $PRERELEASE_FLAG \
            "${{ steps.zip.outputs.artifact }}"

          echo "Release $TAG created successfully!"